# ══════════════════════════════════════════════════════════════════
# CI Pipeline — AuctionV1
# ══════════════════════════════════════════════════════════════════
#
# Mục tiêu: Tự động build + test mỗi khi push code hoặc tạo PR
# vào nhánh main/dev, đảm bảo code luôn compile được và test pass.
#
# Cấu trúc project:
#   Auction-shared  ← compile + test (JUnit, không cần JavaFX)
#   Auction-server  ← compile + test (JUnit, không cần JavaFX)
#   Auction-client  ← chỉ compile   (JavaFX cần display — skip test trên CI)
#
# ══════════════════════════════════════════════════════════════════

name: CI — Build & Test

# ── Trigger ────────────────────────────────────────────────────────
# Chạy khi push hoặc PR vào các nhánh quan trọng
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"   # bắt tất cả feature/xxx
  pull_request:
    branches:
      - main

# ── Concurrency ────────────────────────────────────────────────────
# Nếu push liên tiếp vào cùng 1 nhánh, hủy run cũ, chỉ giữ run mới nhất
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ───────────────────────────────────────────────────────────
jobs:

  # ┌─────────────────────────────────────────────────────────────┐
  # │  Job 1: Test Auction-shared + Auction-server                        │
  # └─────────────────────────────────────────────────────────────┘
  build:
    name: Test (shared + server)
    runs-on: ubuntu-latest

    steps:
      # Tải toàn bộ mã nguồn của dự án từ GitHub về máy ảo của Runner để có code xử lý.
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài JDK 17 (khớp với pom.xml: maven.compiler.release=17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Cache Maven local repo (~/.m2)
      #    key: Chuỗi định danh cho bộ cache.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Chạy file JUnit của 2 module
      - name: Run tests (shared + server)
        run: |
          mvn test \
            -T 1C \
            --no-transfer-progress \
            -pl Auction-shared,Auction-server \
            -am

      #5. Maven sẽ sinh ra các file báo cáo kết quả dạng XML/TXT, rồi đẩy lên giao diện Github
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            Auction-shared/target/surefire-reports/
            Auction-server/target/surefire-reports/
          retention-days: 7

  # ┌─────────────────────────────────────────────────────────────┐
  # │  Job 2: Test Auction-client (JavaFX với virtual display)        │
  # └─────────────────────────────────────────────────────────────┘
  test-client:
    name: Test (client — JavaFX headless)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      #Cache Maven local repo (~/.m2)
      #key: Chuỗi định danh cho bộ cache.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Cài virtual display — JavaFX cần X11 display để khởi động
      #Xvfb sẽ tạo ra một màn hình ảo nằm hoàn toàn trong bộ nhớ RAM. JavaFX sẽ bị "lừa" rằng đang có một màn hình thật để vẽ giao diện lên đó,
      #giúp các đoạn code test giao diện chạy bình thường.
      - name: Install virtual display (Xvfb)
        run: sudo apt-get install -y --no-install-recommends xvfb

      # Chạy test client qua xvfb-run
      - name: Run client tests (via Xvfb)
        run: |
          xvfb-run -a mvn test \
            --no-transfer-progress \
            -pl Auction-client \
            -am \
            -Djava.awt.headless=true

      #Gom toàn bộ kết quả kiểm thử của riêng module Client để đẩy lên GitHub.
      - name: Upload client test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-client
          path: Auction-client/target/surefire-reports/
          retention-days: 7